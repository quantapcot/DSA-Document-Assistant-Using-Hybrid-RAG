# ============================================================
# docker-compose.yml — DSA Document Assistant (Track C)
# ============================================================
# Khởi động toàn bộ hệ thống bằng 1 lệnh:
#   docker compose up --build
#
# Dừng & xóa container:
#   docker compose down
#
# Dừng & xóa container + volume (reset database):
#   docker compose down -v
# ============================================================

version: "3.9"

services:

  # ──────────────────────────────────────────────────────────
  # 1. Qdrant Vector Database (chạy ở chế độ server)
  # ──────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: dsa_qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"  # Host-only debug; Backend uses Docker network
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
    healthcheck:
      # Qdrant image does not necessarily bundle curl or wget.
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/6333;
          printf 'GET /readyz HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3;
          read -r status <&3;
          [[ "$$status" == *" 200 "* ]]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ──────────────────────────────────────────────────────────
  # 2. Backend — FastAPI + Hybrid RAG Engine
  # ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dsa_backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"  # Streamlit calls Backend inside Docker network
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      # Trỏ tới Qdrant container trong Docker network
      QDRANT_MODE: server
      QDRANT_URL: http://qdrant:6333
      RETRIEVAL_CONFIG_PATH: /app/configs/retrieval.mvp.yaml
      SESSION_RUNTIME_DIR: /app/data/runtime
      ENV: production
    env_file:
      - ./backend/.env
    volumes:
      # Keep session registry and temporary uploads across backend restarts.
      - ./data/runtime:/app/data/runtime
      - ./configs:/app/configs:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=4).read()"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 180s

  # ──────────────────────────────────────────────────────────
  # 3. Frontend — Streamlit UI
  # ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dsa_frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Trỏ tới Backend container trong Docker network
      BACKEND_URL: http://backend:8000

# ──────────────────────────────────────────────────────────
# Named Volumes
# ──────────────────────────────────────────────────────────
volumes:
  qdrant_data:
    driver: local
