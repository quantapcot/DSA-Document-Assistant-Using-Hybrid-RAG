# ============================================================
# docker-compose.yml — DSA Document Assistant (Track C)
# ============================================================
# Khởi động toàn bộ hệ thống bằng 1 lệnh:
#   docker compose up --build
#
# Dừng & xóa container:
#   docker compose down
#
# Dừng & xóa container + volume (reset database):
#   docker compose down -v
# ============================================================

version: "3.9"

services:

  # ──────────────────────────────────────────────────────────
  # 1. Qdrant Vector Database (chạy ở chế độ server)
  # ──────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: dsa_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ──────────────────────────────────────────────────────────
  # 2. Backend — FastAPI + Hybrid RAG Engine
  # ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dsa_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      # Trỏ tới Qdrant container trong Docker network
      QDRANT_MODE: server
      QDRANT_URL: http://qdrant:6333
      # LLM — điền API key thực tế vào file .env ở thư mục gốc
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_MODEL: ${LLM_MODEL:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ENV: production
    env_file:
      - ./backend/.env
    volumes:
      # Persist uploaded files và configs giữa các lần restart
      - ./data/runtime/uploads:/app/data/runtime/uploads
      - ./configs:/app/configs:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ──────────────────────────────────────────────────────────
  # 3. Frontend — Streamlit UI
  # ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dsa_frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Trỏ tới Backend container trong Docker network
      BACKEND_URL: http://backend:8000

# ──────────────────────────────────────────────────────────
# Named Volumes
# ──────────────────────────────────────────────────────────
volumes:
  qdrant_data:
    driver: local
